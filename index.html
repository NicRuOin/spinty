<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicolando</title>
<style>
  :root { --bg: #140E36; --card: #2B1F66; --ink: #fff; --ink2: #D4CBFF; --accent: #FFC83D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #3A2390, var(--bg) 70%); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 32px 16px; }
  h1 { font-size: clamp(40px, 10vw, 64px); margin: 0; letter-spacing: 2px;
    background: linear-gradient(90deg, #FF5C93, #FFC83D, #5BE0F5, #9CF55E); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: var(--card); border-radius: 24px; padding: 24px; margin-top: 24px; max-width: 420px; }
  img { width: 120px; height: 120px; border-radius: 28px; }
  p { color: var(--ink2); } a { color: var(--accent); }
  .play { display: inline-block; margin: 8px 0 4px; padding: 14px 34px; border-radius: 18px; background: linear-gradient(#FFD65C, #F5A623); color: #2A1766; font-weight: 900; font-size: 22px; text-decoration: none; box-shadow: 0 6px 0 #B8730F; }
  .code { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
</style>
</head>
<body>
<main>
  <h1>NICOLANDO</h1>
  <div class="card">
    <img src="spinty-icon.png" alt="Spinty App-Icon">
    <h2>Spinty</h2>
    <p>Dreh den Ring. Fang die Farbe.<br>Jetzt direkt im Browser spielen – bald auch im App Store und bei Google Play.</p>
    <p><a class="play" id="play" href="spiel.html">▶ JETZT SPIELEN</a></p>
    <div id="duel" hidden><p>Du wurdest herausgefordert! Tippe auf „Jetzt spielen“ – der Code ist schon eingetragen:</p><p class="code" id="code"></p></div>
    <p><a href="datenschutz.html">Datenschutz &amp; Impressum</a></p>
  </div>
</main>
<script>
  const m = location.search.match(/duell=([0-9A-Za-z]{1,7}-[EMSems]\d{1,4})/);
  if (m) { document.getElementById('duel').hidden = false; document.getElementById('code').textContent = m[1].toUpperCase(); document.getElementById('play').href = 'spiel.html?duell=' + m[1].toUpperCase(); }
</script>
</body>
</html>
